<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloco de código</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../src/components.css"><link rel="stylesheet" href="../src/apps/instagram/style.css"><link rel="stylesheet" href="../src/apps/tiktok/style.css"><link rel="stylesheet" href="../src/apps/claude/style.css"><link rel="stylesheet" href="../src/apps/chatgpt/style.css"><link rel="stylesheet" href="../src/apps/whatsapp/style.css"><style>html,body{margin:0;overflow:hidden;background:transparent}#stage{position:absolute;width:720px;height:1280px;background:#0b141c;overflow:hidden;transform-origin:0 0}.scene-caption{position:absolute;top:110px;left:70px;right:70px;color:#fdfdfe;font:500 49px/1.12 Arial;letter-spacing:-1.5px}.scene-label{position:absolute;left:70px;top:67px;color:#9eb7cc;font:10px Arial;letter-spacing:2px}.position{position:absolute;left:63px;top:385px;transform:scale(1.1);transform-origin:0 0}.scene-footer{position:absolute;bottom:80px;left:70px;color:#8c9faf;font:11px Arial;letter-spacing:2px}</style></head><body><div id="stage" data-composition-id="main" data-start="0" data-duration="9" data-width="720" data-height="1280" data-fps="30"><div class="scene-label">ELIZEU MOYSES / INTERFACES EM CENA</div><h1 class="scene-caption">Bloco de código</h1><div class="scene-footer">CLAUDE / BLOCO DE CÓDIGO</div><div class="clip position" data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics"><div id="component"></div></div></div><script src="../assets/gsap.min.js"></script><script src="../src/runtime.js"></script><script>document.fonts.ready.then(()=>{const rt=window.AppComponentsRuntime;const p=rt.mount(document.getElementById('component'),"claude-code",{"props":{"primary":"Crie uma função para organizar minhas tarefas.","intro":"Aqui está um exemplo simples que você pode adaptar:","language":"JavaScript","code":"const tarefas = [\n  { nome: 'Planejar', prioridade: 1 },\n  { nome: 'Revisar', prioridade: 2 }\n];\n\nfunction organizar(lista) {\n  return [...lista].sort(\n    (a, b) => a.prioridade - b.prioridade\n  );\n}","footer":"Ajuste os critérios para o seu processo."},"theme":"light"});const clock={t:0};const tl=gsap.timeline({paused:true});tl.to(clock,{t:9,duration:9,ease:'none',onUpdate:()=>{const local=clock.t-0;document.querySelector('.position').style.visibility=local<0||local>9?'hidden':'visible';p.seek(Math.max(0,local));}},0);window.__timelines={main:tl};window.sceneReady=true;window.componentPlayer=p;if(new URLSearchParams(location.search).has('preview')){function fit(){const s=Math.min(innerWidth/720,innerHeight/1280);const e=document.getElementById('stage');e.style.transform='scale('+s+')';e.style.left=(innerWidth-720*s)/2+'px';e.style.top=(innerHeight-1280*s)/2+'px';}fit();addEventListener('resize',fit);tl.repeat(-1).repeatDelay(.4).play();}});</script></body></html>
